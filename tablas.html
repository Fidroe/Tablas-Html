<!--En estes documento creamos las tablas en Html-->
<!--Usamos la etiqueta <table> para abrir una tabla, luego usamos la etiqueta <tr> para definir  una fila de la tabla
    y dentro de esta usamos <td> para una celda -->
<!--En Html No se definen las tablas usando el razonamiento de fila y columna como se lo haria de forma usual, mas al contrario las columnas estan definidas a corde a cuantas celdas en una fila hubieramos definido.-->

<html>
<h1>Nuestra primera Tabla</h1>
<table border="3" align="center" width="1200" height="100%" cellspading="0" cellpadding="0">
    <tr align="center">
        <td colspan="2">A1</td>
        <td rowspan="2">A2</td>
        
    </tr>
    
    <tr align="center">
        <td>C1</td>
        <td>C2</td>
        
    </tr>
</table>
<!--Los atributos dentro de  mi tabla son align bgcolor background cellspading cellpadding border height width-->
<!--Los atributos para los elementos de fila y de celda son los siguientes: s: align valing(vertical align valores top botton middle) bgcolor height width colspan rowspan-->

</html>
